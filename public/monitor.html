<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Arena Monitor</title><style>body{margin:0;background:#080b12;color:#fff;font:14px Arial,sans-serif}header{padding:14px 18px;background:#111827;display:flex;gap:12px;align-items:center;position:sticky;top:0}button{background:#26344d;color:#fff;border:1px solid #4b5d7a;border-radius:8px;padding:9px 12px;margin:3px;cursor:pointer}.ok{color:#61e294}.warn{color:#ffd166}.bad{color:#ff6b7f}.wrap{padding:14px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.card{background:#111827;border:1px solid #273247;border-radius:12px;padding:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0b1220;border-radius:9px;padding:10px}.big{font-size:22px;font-weight:800}.log{height:480px;overflow:auto;background:#060a11;padding:8px;border-radius:8px}.event{padding:5px 7px;border-bottom:1px solid #182235;font-size:12px}.players{max-height:520px;overflow:auto}.p{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:5px;padding:6px;border-bottom:1px solid #202b3d;font-size:12px}.red{color:#ff6b88}.blue{color:#63b9ff}input{background:#0b1220;color:#fff;border:1px solid #33415a;border-radius:7px;padding:8px;width:110px}</style></head><body><header><b>⚔️ BATTLE ARENA — BACKEND MONITOR</b><span id="status" class="warn">Connecting...</span><span style="margin-left:auto">Remote monitor</span></header><div class="wrap"><main><div class="card"><div class="stats"><div class="stat">TikTok<div id="tt" class="big">—</div></div><div class="stat">Players<div id="pc" class="big">0</div></div><div class="stat">Likes<div id="likes" class="big">0</div></div><div class="stat">Gifts<div id="gifts" class="big">0</div></div></div></div><div class="card"><h3>🎛️ Controls</h3><button onclick="demo('join')">JOIN test</button><button onclick="demo('attack')">ATTACK test</button><button onclick="demo('shield')">SHIELD test</button><button onclick="demo('rage')">RAGE test</button><button onclick="demo('boss')">BOSS test</button><button onclick="demo('like')">LIKE test</button><button onclick="demo('gift')">GIFT test</button><button onclick="post('/api/control',{action:'reconnect'})">Reconnect TikTok</button><button onclick="post('/api/control',{action:'reset'})">Reset game</button></div><div class="card"><h3>📡 Incoming activity</h3><div id="log" class="log"></div></div><div class="card"><h3>⚙️ Live instellingen</h3><label>Ronde seconden <input id="round" type="number" min="30" max="600" value="120"></label><button onclick="saveSettings()">Opslaan</button><span id="saveMsg"></span></div></main><aside><div class="card"><h3>👥 Players</h3><div class="p"><b>Name</b><b>Team</b><b>HP</b><b>Score</b></div><div id="players" class="players"></div></div></aside></div><script>let ws;function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.onopen=()=>status("Monitor connected","ok");ws.onclose=()=>{status("Reconnecting...","warn");setTimeout(connect,1500)};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state")render(m);if(m.type==="feed")log(m.item)}}function status(t,c){let e=document.getElementById("status");e.textContent=t;e.className=c}function render(s){document.getElementById("tt").textContent=(s.tiktokStatus||"").toUpperCase();document.getElementById("pc").textContent=s.players.length;document.getElementById("likes").textContent=s.totalLikes;document.getElementById("gifts").textContent=s.totalGifts;document.getElementById("players").innerHTML=s.players.map(p=>'<div class="p"><b>'+esc(p.name)+'</b><span class="'+p.team+'">'+p.team+'</span><span>'+Math.round(p.hp)+'/'+Math.round(p.maxHp)+'</span><span>'+p.score+'</span></div>').join("");(s.feed||[]).slice(0,20).reverse().forEach(log)}function log(i){if(!i)return;let d=document.createElement("div");d.className="event";d.textContent=i.text;document.getElementById("log").prepend(d);while(document.getElementById("log").children.length>80)document.getElementById("log").lastChild.remove()}function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}async function post(u,b){await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});}
async function saveSettings(){let v=Number(document.getElementById("round").value);let r=await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({roundSeconds:v})});let j=await r.json();document.getElementById("saveMsg").textContent=j.ok?" ✓ opgeslagen":"";setTimeout(()=>document.getElementById("saveMsg").textContent="",1800);}function demo(a){post("/api/control",{action:"demo",gameAction:a})}connect();</script></body></html>
